<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="Expense Tracker.css">
</head>
<body background="wallpaper1.jpg" style="background-size: cover; background-repeat: no-repeat; background-attachment: fixed; margin: 0; height: 100vh;"></body>
    <header>
        <h1>Expense Tracker</h1>
        <p>An expense tracker displaying basic sample expense records.</p>
    </header>

    <main>
        <form>
            <label for="expense-name">Expense Name:</label>
            <input type="text" id="expense-name" name="expense-name" required><br><br>

            <label for="expense-amount">Expense Amount:</label>
            <input type="number" id="expense-amount" name="expense-amount" required><br><br>

            <label for="expense-date">Expense Date:</label>
            <input type="date" id="expense-date" name="expense-date" required><br><br>

            

            <button type="submit" id="add-expense">Add Expense</button>
        </form>
        
        <section>
            <p id="feedback" style="color: #000000;"></p>        
            <p id="summary" style="color: #000000;"></p>
            <div id="row" style="color: #000000;"></div>
        </section>
    </main>

    <footer>
        <p></p>
    </footer>

    <script src="Expense Tracker.js"></script>
</body>
</html>
